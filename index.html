<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuis Berkah Ramadhan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#047857', // Emerald 600
                            dark: '#022c22', // Emerald 900
                            gold: '#fbbf24', // Amber 400
                            light: '#fef3c7', // Amber 50
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #022c22;
            background-image: radial-gradient(circle at top right, #047857 0%, transparent 50%), radial-gradient(circle at bottom left, #065f46 0%, transparent 50%);
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(10px);
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }

        /* Option Button Animation */
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Input styling */
        .modern-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .modern-input:focus {
            border-color: #fbbf24;
            background: rgba(255, 255, 255, 0.15);
        }
        .modern-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* Disable number arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="text-white h-screen w-screen overflow-hidden flex justify-center items-center">

    <!-- Container for mobile simulation & layout -->
    <div class="w-full max-w-md h-full relative flex flex-col p-6 shadow-2xl overflow-y-auto">
        
        <!-- Welcome Screen -->
        <div id="screen-welcome" class="screen flex-col items-center justify-center h-full active">
            <div class="mb-8 p-5 bg-brand-green/20 rounded-full inline-block backdrop-blur-md border border-brand-green/30 shadow-lg shadow-brand-green/20">
                <svg class="w-16 h-16 text-brand-gold" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21.5 14.07A8.99 8.99 0 0113.8 3a8.98 8.98 0 00-4.8 16.5A8.98 8.98 0 0021.5 14.07z" />
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-brand-gold to-yellow-200 mb-5 text-center leading-tight tracking-tight">Kuis Berkah<br>Ramadhan</h1>
            <p class="text-gray-300 text-center mb-10 text-base px-2 leading-relaxed">Jawab 5 pertanyaan berturut-turut dengan benar dalam <span class="text-brand-gold font-semibold tracking-wide">2 menit</span> dan menangkan saldo GoPay <span class="text-brand-gold font-semibold tracking-wide">Rp 50.000!</span></p>
            <button onclick="startQuiz()" class="w-full bg-brand-gold hover:bg-yellow-400 text-brand-dark font-bold py-4 px-8 rounded-xl shadow-lg shadow-brand-gold/20 transition-all active:scale-95 text-lg">Mulai Kuis</button>
        </div>

        <!-- Quiz Screen -->
        <div id="screen-quiz" class="screen flex-col h-full py-4 relative">
            <div class="flex justify-between items-center mb-8 glass-card p-4 shadow-md">
                <div class="text-sm font-semibold text-brand-gold tracking-wide">Soal: <span id="soal-counter" class="text-white">1</span>/5</div>
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <div id="timer-display" class="text-sm font-mono font-bold tracking-wider text-white transition-colors duration-300">02:00</div>
                </div>
            </div>
            
            <div class="flex-grow flex flex-col justify-center">
                <h2 id="question-text" class="text-xl sm:text-2xl font-semibold mb-8 text-center leading-snug drop-shadow-md">Question text goes here?</h2>
                <div id="options-container" class="space-y-3 w-full">
                    <!-- Options injected here via JS -->
                </div>
            </div>
        </div>

        <!-- Lose Screen -->
        <div id="screen-lose" class="screen flex-col items-center justify-center h-full">
            <div class="mb-6 p-5 bg-red-500/10 rounded-full border border-red-500/20 shadow-lg shadow-red-500/10">
                <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-white mb-3 tracking-tight">Maaf, Anda Gagal!</h2>
            <p id="lose-reason" class="text-red-300 mb-10 text-center px-4 text-base">Jawaban Anda salah.</p>
            <button onclick="closeApp('lose')" class="w-full glass-card hover:bg-white/10 text-white font-semibold py-4 px-8 rounded-xl transition-all active:scale-95 shadow-lg">Tutup</button>
        </div>

        <!-- Win Screen -->
        <div id="screen-win" class="screen flex-col items-center justify-center h-full pt-8 pb-4">
            <div class="mb-6 p-5 bg-brand-gold/10 rounded-full border border-brand-gold/20 shadow-lg shadow-brand-gold/10">
                <svg class="w-16 h-16 text-brand-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-brand-gold mb-2 tracking-tight">Alhamdulillah,<br>Menang!</h2>
            <p class="text-gray-300 text-center mb-8 text-sm px-2">Silakan isi data berikut untuk klaim GoPay Rp 50.000.</p>
            
            <div class="w-full space-y-4 mb-8">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1 uppercase tracking-wider">Nama Lengkap</label>
                    <input type="text" id="input-nama" class="modern-input" placeholder="Masukkan nama..." required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1 uppercase tracking-wider">Nomor GoPay</label>
                    <input type="number" id="input-gopay" class="modern-input" placeholder="08..." required>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1.5 ml-1 uppercase tracking-wider">Username IG</label>
                    <input type="text" id="input-ig" class="modern-input" placeholder="@username" required>
                </div>
            </div>
            
            <button id="btn-claim" onclick="submitClaim()" class="w-full mt-auto bg-brand-gold hover:bg-yellow-400 text-brand-dark font-bold py-4 px-8 rounded-xl shadow-lg shadow-brand-gold/20 transition-all active:scale-95 text-lg">Klaim Hadiah</button>
        </div>

    </div>

    <script>
        // 1. Telegram Web App Mock & Initialization
        const tg = window.Telegram?.WebApp || { 
            expand: () => console.log('tg.expand() called'), 
            sendData: (data) => console.log('tg.sendData()', data), 
            close: () => alert("Web App Closed") 
        };
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                tg.expand();
            } catch (e) {
                console.warn('Telegram WebApp expand failed:', e);
            }
        });

        // 2. Quiz Data (5 questions)
        const questions = [
            { 
                q: "Perang Badar, yang merupakan perang besar pertama dalam sejarah Islam, terjadi pada tanggal berapa di bulan Ramadhan?", 
                o: ["17 Ramadhan", "10 Ramadhan", "1 Ramadhan", "27 Ramadhan"], 
                a: 0 
            },
            { 
                q: "Peristiwa turunnya ayat Al-Quran untuk pertama kalinya kepada Nabi Muhammad SAW disebut dengan?", 
                o: ["Lailatul Qadar", "Nuzulul Quran", "Isra Miraj", "Maulid Nabi"], 
                a: 1 
            },
            { 
                q: "Apa nama pintu surga yang khusus disediakan oleh Allah SWT dan hanya bisa dimasuki oleh orang-orang yang berpuasa?", 
                o: ["Ar-Rayyan", "Al-Firdaus", "Jannatul Adn", "Al-Kautsar"], 
                a: 0 
            },
            { 
                q: "Salat sunnah yang sangat dianjurkan dan pelaksanaannya hanya ada di malam bulan Ramadhan adalah?", 
                o: ["Salat Tahajud", "Salat Dhuha", "Salat Tarawih", "Salat Witir"], 
                a: 2 
            },
            { 
                q: "Zakat yang diwajibkan bagi setiap jiwa muslim menjelang usainya bulan Ramadhan atau sebelum salat Idul Fitri adalah?", 
                o: ["Zakat Mal", "Zakat Fitrah", "Zakat Profesi", "Zakat Perniagaan"], 
                a: 1 
            }
        ];

        // 3. Application State Variables
        let score = 0;
        let timeLeft = 120; // 2 minutes
        let currentQuestionIndex = 0;
        let timerInterval = null;
        let loseReasonText = "";

        // Elements
        const screens = {
            welcome: document.getElementById('screen-welcome'),
            quiz: document.getElementById('screen-quiz'),
            lose: document.getElementById('screen-lose'),
            win: document.getElementById('screen-win')
        };
        const timerDisplay = document.getElementById('timer-display');
        const soalCounter = document.getElementById('soal-counter');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const loseReason = document.getElementById('lose-reason');

        // Functions
        function showScreen(screenName) {
            Object.values(screens).forEach(s => {
                s.classList.remove('active');
            });
            // Little delay to allow DOM transition cycle
            setTimeout(() => {
                screens[screenName].classList.add('active');
            }, 50);
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timeLeft);
            if (timeLeft < 15) {
                // Apply red warning text
                timerDisplay.classList.remove('text-white');
                timerDisplay.classList.add('text-red-400');
            } else {
                // Restore white text
                timerDisplay.classList.remove('text-red-400');
                timerDisplay.classList.add('text-white');
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleLose("waktu habis");
                }
            }, 1000);
        }

        function startQuiz() {
            score = 0;
            timeLeft = 120;
            currentQuestionIndex = 0;
            showScreen('quiz');
            loadQuestion();
            startTimer();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            soalCounter.textContent = currentQuestionIndex + 1;
            questionText.textContent = q.q;
            
            optionsContainer.innerHTML = '';
            q.o.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl p-4 text-white text-sm sm:text-base font-medium shadow-sm outline-none focus:ring-2 focus:ring-brand-gold/50 flex items-center';
                
                const label = document.createElement('span');
                label.className = 'inline-flex justify-center items-center w-8 h-8 rounded-full bg-white/10 text-brand-gold font-bold mr-3 flex-shrink-0';
                label.textContent = String.fromCharCode(65 + index);
                
                const textSpan = document.createElement('span');
                textSpan.textContent = optText;
                
                btn.appendChild(label);
                btn.appendChild(textSpan);
                
                btn.onclick = () => handleAnswer(index);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex) {
            const q = questions[currentQuestionIndex];
            if (selectedIndex === q.a) {
                // Correct Answer
                currentQuestionIndex++;
                if (currentQuestionIndex >= questions.length) {
                    handleWin();
                } else {
                    loadQuestion();
                }
            } else {
                // Wrong Answer
                handleLose("salah");
            }
        }

        function handleLose(reason) {
            clearInterval(timerInterval);
            loseReasonText = reason;
            if (reason === "salah") {
                loseReason.textContent = "Jawaban Anda salah. Tetap semangat!";
            } else if (reason === "waktu habis") {
                loseReason.textContent = "Waktu Anda habis. Coba lagi di lain waktu!";
            }
            showScreen('lose');
        }

        function handleWin() {
            clearInterval(timerInterval);
            showScreen('win');
        }

        function closeApp(type) {
            if (type === 'lose') {
                const payload = JSON.stringify({ status: "lose", reason: loseReasonText });
                tg.sendData(payload);
                tg.close();
            }
        }

        function submitClaim() {
            const nama = document.getElementById('input-nama').value.trim();
            const gopay = document.getElementById('input-gopay').value.trim();
            const ig = document.getElementById('input-ig').value.trim();

            if (!nama || !gopay || !ig) {
                alert("Mohon lengkapi semua data formulir untuk klaim hadiah.");
                return;
            }

            const payload = JSON.stringify({
                status: "win",
                reason: "finished",
                claim_data: {
                    nama: nama,
                    gopay: gopay,
                    ig: ig
                }
            });

            tg.sendData(payload);
            tg.close();
        }
    </script>
</body>
</html>
